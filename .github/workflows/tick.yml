name: tick
# Match reminders, no-show and deadline forfeits, Discord queue.
# Vercel Hobby cron runs only once a day, so this provides the 5-minute clock.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS --max-time 90 https://rl-arena-eight.vercel.app/api/cron/tick
